<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img"><title>How credential stuffing works</title><rect x="1" y="1" width="598" height="428" rx="24" fill="#FFFFFF" stroke="#D8E6EF" stroke-width="2"/><path d="M1 24 Q1 1 24 1 H576 Q599 1 599 24" fill="none" stroke="#00AEEF" stroke-width="5"/><rect x="80" y="40.0" width="440" height="64.0" rx="12" fill="#E6F7FD" stroke="#00AEEF" stroke-width="1.5"/><circle cx="114" cy="72.0" r="17" fill="#00AEEF"/><text x="114" y="78.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="114" dy="0">1</tspan></text><text x="146" y="67.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1B2B49" text-anchor="start"><tspan x="146" dy="0">Leaked credentials obtained</tspan></text><text x="146" y="90.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526078" text-anchor="start"><tspan x="146" dy="0">From other breaches</tspan></text><path d="M300 106.0v28.7m-6-6 6 6 6-6" fill="none" stroke="#00AEEF" stroke-width="2.5"/><rect x="80" y="138.7" width="440" height="64.0" rx="12" fill="#E6F7FD" stroke="#00AEEF" stroke-width="1.5"/><circle cx="114" cy="170.7" r="17" fill="#00AEEF"/><text x="114" y="176.7" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="114" dy="0">2</tspan></text><text x="146" y="165.7" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1B2B49" text-anchor="start"><tspan x="146" dy="0">Bots replay the pairs</tspan></text><text x="146" y="188.7" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526078" text-anchor="start"><tspan x="146" dy="0">Across many accounts</tspan></text><path d="M300 204.7v28.7m-6-6 6 6 6-6" fill="none" stroke="#00AEEF" stroke-width="2.5"/><rect x="80" y="237.3" width="440" height="64.0" rx="12" fill="#E6F7FD" stroke="#00AEEF" stroke-width="1.5"/><circle cx="114" cy="269.3" r="17" fill="#00AEEF"/><text x="114" y="275.3" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="114" dy="0">3</tspan></text><text x="146" y="264.3" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1B2B49" text-anchor="start"><tspan x="146" dy="0">Attempts are spread out</tspan></text><text x="146" y="287.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526078" text-anchor="start"><tspan x="146" dy="0">Over addresses and time</tspan></text><path d="M300 303.3v28.7m-6-6 6 6 6-6" fill="none" stroke="#00AEEF" stroke-width="2.5"/><rect x="80" y="336.0" width="440" height="64.0" rx="12" fill="#1B2B49" stroke="#1B2B49" stroke-width="1.5"/><circle cx="114" cy="368.0" r="17" fill="#00AEEF"/><text x="114" y="374.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="114" dy="0">4</tspan></text><text x="146" y="363.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="146" dy="0">Accounts are taken over</tspan></text><text x="146" y="386.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#CFE9F7" text-anchor="start"><tspan x="146" dy="0">Data, rewards, stored cards</tspan></text></svg>