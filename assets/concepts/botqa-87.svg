<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img"><title>Fingerprints and challenges</title><rect x="1" y="1" width="598" height="428" rx="24" fill="#FFFFFF" stroke="#D8E6EF" stroke-width="2"/><path d="M1 24 Q1 1 24 1 H576 Q599 1 599 24" fill="none" stroke="#00AEEF" stroke-width="5"/><rect x="34" y="34" width="250" height="362" rx="16" fill="#F1F4F8" stroke="#E1E8F0" stroke-width="1.5"/><rect x="54" y="54" width="210" height="40" rx="20" fill="#00AEEF"/><text x="159" y="80.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2"><tspan x="159" dy="0">FINGERPRINTING</tspan></text><circle cx="68" cy="151.8" r="6" fill="#00AEEF"/><text x="84" y="147.2" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1B2B49" text-anchor="start"><tspan x="84" dy="0">Device, network,</tspan><tspan x="84" dy="23">behavior</tspan></text><circle cx="68" cy="219.2" r="6" fill="#00AEEF"/><text x="84" y="214.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="84" dy="0">Probabilistic</tspan><tspan x="84" dy="23">signal</tspan></text><circle cx="68" cy="286.8" r="6" fill="#00AEEF"/><text x="84" y="282.2" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="84" dy="0">Can be shared or</tspan><tspan x="84" dy="23">imitated</tspan></text><circle cx="68" cy="354.2" r="6" fill="#00AEEF"/><text x="84" y="349.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="84" dy="0">Not a guaranteed</tspan><tspan x="84" dy="23">identity</tspan></text><rect x="316" y="34" width="250" height="362" rx="16" fill="#FFFFFF" stroke="#1B2B49" stroke-width="1.5"/><rect x="336" y="54" width="210" height="40" rx="20" fill="#1B2B49"/><text x="441" y="80.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2"><tspan x="441" dy="0">CHALLENGES</tspan></text><circle cx="350" cy="151.8" r="6" fill="#1B2B49"/><text x="366" y="147.2" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1B2B49" text-anchor="start"><tspan x="366" dy="0">Test a specific</tspan><tspan x="366" dy="23">claim</tspan></text><circle cx="350" cy="219.2" r="6" fill="#1B2B49"/><text x="366" y="214.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="366" dy="0">Validate every</tspan><tspan x="366" dy="23">result</tspan></text><circle cx="350" cy="286.8" r="6" fill="#1B2B49"/><text x="366" y="282.2" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="366" dy="0">Evidence within</tspan><tspan x="366" dy="23">its scope</tspan></text><circle cx="350" cy="354.2" r="6" fill="#1B2B49"/><text x="366" y="349.8" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#1B2B49" text-anchor="start"><tspan x="366" dy="0">Not payment</tspan><tspan x="366" dy="23">authorization</tspan></text><circle cx="300" cy="215" r="17" fill="#FFFFFF" stroke="#00AEEF" stroke-width="2"/><text x="300" y="220.0" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#007C9E" text-anchor="middle"><tspan x="300" dy="0">vs</tspan></text></svg>